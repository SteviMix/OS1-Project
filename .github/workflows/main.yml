name: Build kernel

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - uses: actions/checkout@v4

      - name: Install RISC-V toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu g++-riscv64-linux-gnu qemu-system-misc

      - name: Build
        run: make qemu

      - name: Boot in QEMU (smoke test)
        run: timeout 20s make qemu || [ $? -eq 124 ]
